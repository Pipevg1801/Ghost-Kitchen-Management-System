databases:
  - name: ghost-kitchen-db
    plan: free
    databaseName: restaurant_db
    user: restaurant_user

services:
  - type: web
    name: ghost-kitchen
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: ghost-kitchen-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SEED_DEMO
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
