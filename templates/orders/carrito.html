{% extends "base.html" %}
{% load static %}
{% block title %}Tu carrito{% endblock %}
{% block content %}
<div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
  <h1 class="h3 fw-bold mb-0"><i class="bi bi-cart3"></i> Tu carrito</h1>
  <a href="{% url 'menu:catalogo' %}" class="btn btn-outline-dark btn-sm"><i class="bi bi-arrow-left"></i> Seguir comprando</a>
</div>
<div class="card shadow-sm border-0 seccion-carrito">
  <div class="card-body" data-carrito="completo">
    {% include "orders/includes/carrito_completo.html" %}
  </div>
</div>
{% endblock %}
{% block extra_js %}<script src="{% static 'js/carrito.js' %}"></script>{% endblock %}
