{% if pedidos %}

    {% for pedido in pedidos %}
      <div class="col-md-6 col-xl-4">{% include "orders/includes/tarjeta_mi_pedido.html" %}</div>
    {% endfor %}
  </div>
  {% include "includes/paginacion.html" %}
{% else %}
  <div class="text-center text-body-secondary py-5">
    <i class="bi bi-bag display-5"></i>
    <p class="mt-3">Aún no ha realizado pedidos.</p>
    <a href="{% url 'menu:catalogo' %}" class="btn btn-dark">Ir al menú</a>
  </div>
{% endif %}
