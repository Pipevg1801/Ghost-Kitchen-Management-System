<div class="motion-control">
  <label for="motion-{{ location }}"><i class="bi bi-sliders2" aria-hidden="true"></i> Movimiento</label>
  <select id="motion-{{ location }}" data-motion-select aria-label="Preferencia de movimiento">
    <option value="auto">Automático</option>
    <option value="full">Experiencia viva</option>
    <option value="reduced">Movimiento reducido</option>
  </select>
</div>
