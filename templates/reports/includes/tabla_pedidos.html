{% load formato pedidos %}
<div class="table-responsive">
  <table class="table table-hover align-middle mb-0">
    <thead class="table-light">
      <tr>
        <th scope="col">Pedido</th>
        <th scope="col">Cliente</th>
        <th scope="col">Fecha</th>
        <th scope="col" class="text-end">Total</th>
        <th scope="col">Estado</th>
      </tr>
    </thead>
    <tbody>
      {% for pedido in pedidos %}
        <tr>
          <td><a href="{% url 'orders:pedido_detalle' pedido.pk %}" class="fw-semibold">#{{ pedido.pk }}</a></td>
          <td>{{ pedido.usuario.nombre }}</td>
          <td class="small text-nowrap">{{ pedido.fecha_creacion|date:"d/m/Y H:i" }}</td>
          <td class="text-end text-nowrap">{{ pedido.total|moneda }}</td>
          <td>{% badge_estado pedido %}</td>
        </tr>
      {% empty %}
        <tr><td colspan="5" class="text-center text-body-secondary py-4">No hay pedidos para mostrar.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
